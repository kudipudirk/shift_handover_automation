<!DOCTYPE html>
<html>
<head>
    <title>Change Password - ITConvergence Shift Handover Portal</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 380px; border-top: 6px solid #1F4E78; }
        h3 { margin-top: 0; color: #1F4E78; text-align: center; }
        label { font-size: 13px; font-weight: bold; color: #333; margin-bottom: 5px; display: block; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ced4da; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 11px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .alert { background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; font-size: 13px; margin-bottom: 15px; text-align: center; }
        .info-text { font-size: 12px; color: #6c757d; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h3>🔐 Password Change Required</h3>
        <p class="info-text">You logged in with a temporary password. Please set a new permanent password to continue.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/change_password" method="POST">
            <div>
                <label>New Password:</label>
                <input type="password" name="new_password" required minlength="6" placeholder="Enter new password">
            </div>
            <div>
                <label>Confirm New Password:</label>
                <input type="password" name="confirm_password" required minlength="6" placeholder="Confirm new password">
            </div>
            <button type="submit">Update Password & Continue ➔</button>
        </form>
    </div>
</body>
</html>
